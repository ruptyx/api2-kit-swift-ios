name: Shots
options:
  bundleIdPrefix: com.example.shots
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ShotsHost:
    type: application
    platform: iOS
    sources: [Host]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.shots.host
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  ShotsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: ShotsHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.shots.uitests
schemes:
  Shots:
    build:
      targets:
        ShotsHost: all
        ShotsUITests: [test]
    test:
      targets:
        - ShotsUITests
